front:
  text: 太上七星神呪經黃老元帝於上清王洞紫宸金闕臺問天老曰下界人民災禍之由起乎何也天老曰昔混沌未分元化體一天地設位乃見五行巡歷天下察無道之國觀不樣之人凡處虛域之內蠢動含生命係於天星辰凌犯彗孛衝破遂生兵災水旱流移知而逃形可全自己逆之遇害凶釁迭生黎民死亡淪沈苦海元帝曰民之所苦吾豈忍之何以救拔免遭厄難天老帝君令念七星神呪禹步微言每日面東七遍可以上消天災下散地禍妖邪蠱魅魍魎毒精自消攝伏遠行避路不敢損害道人能除錯謬之氣續罄竭之年凡百災殃隨呪即滅汝須祕藏金匱愼勿流傳授非其人天降刑書即説呪曰
  hash: sha256:f6ca4f0f2abef1992bdcc72da8fc56d76218eb72567d890def18a6388ca40e55
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0067_HFL_000-001a, image: hfl/0182/0182-124.png}
body:
  text: 日出東方赫赫大光靈神衛我慶門立章椂存拱惠不雲炳剛把持既濟標攝大匡未越絶命故水鬼鄉三元滿體八神作強逆吾者死敢有衝當黃老律今急離遠方北神統録未斷不祥急急如律令太上七星神呪經
  hash: sha256:8a2d7d76e31ababd071f5e458380b7c673bb19e9fa591df60ba808cdbbb1ad5e
