front:
  text: 太上七星神呪經黃老元帝於上清王洞紫宸金闕臺問天老曰下界人民灾禍之由起乎何也天老曰昔混沌未分元化體一天地設位乃見五行廵歴天下察無道之國觀不样之人凡處虚域之内蠢動含生命係於天星辰凌犯彗孛衝破遂生兵灾水旱流移知而逃形可全自己逆之遇害凶釁迭生黎民死亡淪沈苦海元帝曰民之所苦吾豈忍之何以救抜免遭戹難天老帝君令念七星神呪禹歩微言毎日面東七徧可以上消天灾下散地禍妖邪蠱魅魍魎毒精自消攝伏遠行避路不敢損害道人能除錯謬之氣續罄竭之年凡百灾殃隨呪即滅汝須秘藏金櫃愼勿流傳授非其人天降刑書即說呪曰
  hash: sha256:39ea86a3231d99a30fda3a9b568eba927f853340fc51e51e0fd9228eb12b8272
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0067_HFL_000-001a, image: hfl/0182/0182-124.png}
body:
  text: 日岀東方赫赫大光靈神衞我慶門立章椂存拱惠不雲炳剛把持旣濟標攝大匡未越絶命故水鬼鄉三元滿體八神作彊逆吾者死敢有衝當黃老律今急離遠方北神統録未斷不祥急急如律令太上七星神呪經
  hash: sha256:6cc88611eb410f358077d2c6ff1f5ae8530617574adab13222fddbbac2002d2b
